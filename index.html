<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>智能体公开内测</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>
<body>
<div id="coze-chat" style="width:100%;height:95vh;"></div>
<script src="https://lf-cdn.coze.cn/obj/unpkg/flow-platform/chat-app-sdk/1.2.0/cn/index.js"></script>
<script>
const BOT_ID = "替换你的BotID";
//替换成Render给你的域名
const BACKEND_TOKEN_API = "https://xxx-coze-jwt-backend.onrender.com/api/get-coze-token";

async function initChatSdk(){
  const resp = await fetch(BACKEND_TOKEN_API);
  const data = await resp.json();
  const accessToken = data.access_token;

  new CozeWebSDK.WebChatClient({
    config:{ bot_id: BOT_ID },
    auth:{
      type:"token",
      token: accessToken,
      onRefreshToken: async () => {
        const r = await fetch(BACKEND_TOKEN_API);
        const d = await r.json();
        return d.access_token;
      }
    },
    ui:{ container:"coze-chat" },
    userInfo:{
      id:"tester_"+Math.random().toString(36),
      nickname:"内测用户"
    }
  });
}
initChatSdk();
</script>
</body>
</html>
